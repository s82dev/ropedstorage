<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Passwort-Video</title>
  <style>
    body { font-family: sans-serif; background:#111; color:#eee; text-align:center; }
    #video-container { display:none; margin-top:20px; }
    input { padding:8px; }
    button { padding:8px 14px; margin-left:6px; }
  </style>
</head>
<body>

  <h1>Geschütztes Video</h1>

  <div id="login">
    <input type="password" id="pw" placeholder="Passwort">
    <button onclick="checkPassword()">OK</button>
    <p id="msg"></p>
  </div>

  <div id="video-container">
    <video id="vid" width="640" controls></video>
  </div>

  <script>
    const CORRECT_PW = "meinpasswort";      // <-- hier dein Passwort
    const VIDEO_URL  = "video.mp4";         // <-- hier dein Videoname

    function checkPassword() {
      const pw = document.getElementById("pw").value;
      const msg = document.getElementById("msg");

      if (pw === CORRECT_PW) {
        document.getElementById("login").style.display = "none";
        const vid = document.getElementById("vid");
        vid.src = VIDEO_URL;
        document.getElementById("video-container").style.display = "block";
      } else {
        msg.textContent = "Falsches Passwort.";
      }
    }
  </script>

</body>
</html>
