<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Geschütztes Video</title>
  <style>
    body { background:#111; color:#eee; font-family:sans-serif; text-align:center; }
    #video { display:none; margin-top:20px; }
    input { padding:8px; }
    button { padding:8px 14px; }
  </style>
</head>
<body>

<h2>Passwort eingeben</h2>

<input type="password" id="pw" placeholder="Passwort">
<button onclick="unlock()">OK</button>
<p id="msg"></p>

<video id="video" width="640" controls>
  <source id="src" type="video/mp4">
</video>

<script>
  const PASS = "1234";        // <-- dein Passwort
  const VIDEO = "video.mp4";  // <-- dein Video

  function unlock() {
    const pw = document.getElementById("pw").value;
    const msg = document.getElementById("msg");

    if (pw === PASS) {
      document.getElementById("src").src = VIDEO;
      document.getElementById("video").style.display = "block";
      msg.textContent = "";
    } else {
      msg.textContent = "Falsches Passwort.";
    }
  }
</script>

</body>
</html>
