<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bild verschlüsseln</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body { background:#111; color:#eee; font-family:sans-serif; text-align:center; }
    input { margin:8px; }
  </style>
</head>
<body>

<h2>Bild verschlüsseln</h2>

<input type="file" id="file" accept="image/*"><br>
<input type="password" id="pw" placeholder="Passwort"><br>
<button onclick="encryptFile()">Verschlüsseln</button>

<p id="msg"></p>

<script>
async function encryptFile() {
  const fileInput = document.getElementById("file");
  const pw = document.getElementById("pw").value;
  const msg = document.getElementById("msg");

  if (!fileInput.files[0] || !pw) {
    msg.textContent = "Datei und Passwort wählen.";
    return;
  }

  const file = fileInput.files[0];
  const arrayBuffer = await file.arrayBuffer();
  const wordArray = CryptoJS.lib.WordArray.create(arrayBuffer);

  const iv = CryptoJS.enc.Utf8.parse(pw.substring(0,16));
  const key = CryptoJS.enc.Utf8.parse(pw);

  const encrypted = CryptoJS.AES.encrypt(wordArray, key, {
    iv: iv,
    mode: CryptoJS.mode.CBC,
    padding: CryptoJS.pad.Pkcs7
  });

  const encBytes = CryptoJS.enc.Base64.parse(encrypted.toString());
  const encArray = new Uint8Array(encBytes.sigBytes);
  for (let i = 0; i < encBytes.sigBytes; i++) {
    encArray[i] = encBytes.words[i >>> 2] >>> (24 - (i % 4) * 8);
  }

  const blob = new Blob([encArray], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = file.name + ".enc";
  a.click();

  msg.textContent = "Verschlüsselt: " + a.download;
}
</script>

</body>
</html>
